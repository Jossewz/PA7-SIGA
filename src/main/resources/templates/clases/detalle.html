<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html(~{::content})}">
<head>
    <title th:text="${title}">Gestión de Curso – IEACI</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="flex flex-col gap-6">
        
        <!-- Header con Botón de Regreso -->
        <div class="flex flex-col gap-3">
            <div>
                <a th:href="@{/clases}" class="inline-flex items-center gap-1.5 text-xs font-black text-sidebar hover:underline">
                    <i data-lucide="arrow-left" class="size-4 stroke-[2.5]"></i>
                    <span>Volver a Cursos</span>
                </a>
            </div>

            <!-- Mensajes Flash de Éxito o Error -->
            <div th:if="${mensajeExito}" class="p-4 rounded-xl bg-green-50 border border-green-200 text-xs font-bold text-sidebar flex items-center gap-2">
                <i data-lucide="check-circle" class="size-4.5 text-sidebar"></i>
                <span th:text="${mensajeExito}">Éxito</span>
            </div>
            <div th:if="${mensajeError}" class="p-4 rounded-xl bg-red-50 border border-red-200 text-xs font-bold text-alert-red flex items-center gap-2">
                <i data-lucide="alert-triangle" class="size-4.5 text-alert-red"></i>
                <span th:text="${mensajeError}">Error</span>
            </div>

            <div class="flex items-center justify-between gap-4 max-sm:flex-col max-sm:items-start bg-white p-5 rounded-xl border border-[#c4eec0]/50 shadow-soft">
                <div class="flex items-center gap-4">
                    <div class="size-12 rounded-xl bg-sidebar text-white grid place-items-center shadow-md shrink-0">
                        <i data-lucide="graduation-cap" class="size-6 stroke-[2.5]"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-3">
                            <h1 class="text-text-primary text-[24px] font-black tracking-tight leading-none" th:text="${'Curso ' + codigoCurso}">Curso 11-01</h1>
                            <span class="px-2.5 py-1 bg-[#eafbe4] text-sidebar border border-[#c4eec0] rounded-md font-bold text-[11px]" th:text="${'Jornada ' + jornadaCurso}">Jornada Mañana</span>
                        </div>
                        <p class="text-text-secondary text-[12px] font-semibold mt-1">
                            Director de Grupo: <span class="font-bold text-text-primary" th:text="${directorCurso}">Sin asignar</span> • 
                            Grado: <span class="font-bold text-sidebar" th:text="${gradoCurso}">11°</span> • 
                            Estudiantes: <span class="font-bold text-sidebar" th:text="${#lists.size(estudiantesData) + ' Matriculados'}">0 Matriculados</span>
                        </p>
                    </div>
                </div>

                <!-- Botones de Acción -->
                <div class="flex items-center gap-2 shrink-0 flex-wrap">
                    <form th:action="@{/clases/mapear-estudiantes}" method="post" class="inline" th:if="${cursoId != null && !cursoId.isEmpty()}">
                        <input type="hidden" name="cursoId" th:value="${cursoId}" />
                        <button type="submit" class="px-4 py-2.5 text-xs font-black text-sidebar bg-[#eafbe4] border border-[#c4eec0] hover:bg-pill-green rounded-lg transition-all flex items-center gap-1.5 shadow-xs cursor-pointer">
                            <i data-lucide="user-plus" class="size-4 stroke-[2.5]"></i>
                            <span>Auto-Mapear Matriculados</span>
                        </button>
                    </form>

                    <form th:action="@{/clases/promover-estudiantes}" method="post" id="form-promover" class="inline" th:if="${cursoId != null && !cursoId.isEmpty()}" onsubmit="return prepararPromocion(event);">
                        <input type="hidden" name="cursoId" th:value="${cursoId}" />
                        <input type="hidden" name="notasJson" id="input-promover-notas-json" />
                        <button type="submit" class="px-4 py-2.5 text-xs font-black text-amber-900 bg-amber-100 border border-amber-300 hover:bg-amber-200 rounded-lg transition-all flex items-center gap-1.5 shadow-xs cursor-pointer">
                            <i data-lucide="arrow-up-right" class="size-4 stroke-[2.5]"></i>
                            <span>Promover Año Lectivo</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Control de Fecha, Horario y Selección de Materia -->
        <div class="bg-white p-5 rounded-xl border border-[#c4eec0]/50 shadow-soft flex items-center justify-between gap-4 max-lg:flex-col max-lg:items-start">
            <div class="flex items-center gap-4 flex-wrap w-full lg:w-auto">
                
                <!-- Date picker -->
                <div class="flex flex-col">
                    <label for="fecha-evaluacion" class="text-[9px] font-black uppercase text-text-secondary tracking-wider mb-1">Fecha de Clase / Evaluación</label>
                    <input type="date" id="fecha-evaluacion" onchange="actualizarMateriaPorFecha()" class="h-10 px-3.5 bg-[#f9fbf8] border border-[#c4eec0] rounded-xl text-xs font-extrabold text-sidebar focus:ring-1 focus:ring-sidebar focus:outline-none cursor-pointer">
                </div>

                <!-- Día de la semana -->
                <div class="flex flex-col justify-end">
                    <span class="text-[9px] font-black uppercase text-text-secondary tracking-wider mb-1">Día Programado</span>
                    <span id="dia-semana-badge" class="h-10 px-4 bg-[#eafbe4] text-sidebar border border-[#c4eec0] rounded-xl text-xs font-black flex items-center gap-1.5 shadow-2xs">
                        <i data-lucide="calendar-days" class="size-4 stroke-[2.5]"></i>
                        <span id="dia-nombre">Lunes</span>
                    </span>
                </div>

                <!-- Selector de Materia -->
                <div class="flex flex-col flex-1 min-w-[220px]">
                    <label for="select-materia" class="text-[9px] font-black uppercase text-text-secondary tracking-wider mb-1">Materia según Horario</label>
                    <div id="container-materia-select">
                        <select id="select-materia" onchange="cambiarMateriaSeleccionada(this.value)" class="w-full h-10 px-3.5 bg-[#f9fbf8] border border-[#c4eec0] rounded-xl text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none cursor-pointer">
                            <!-- Inyectado dinámicamente por JS -->
                        </select>
                    </div>
                </div>

            </div>

            <!-- Banner de Info de Horario -->
            <div id="status-horario-banner" class="px-4 py-2.5 bg-[#f7fcf6] border border-[#c4eec0] rounded-xl text-[11px] font-bold text-sidebar flex items-center gap-2 shrink-0">
                <i data-lucide="clock" class="size-4 text-sidebar stroke-[2.5]"></i>
                <span id="horario-info-text">Horario: 07:00 AM - 08:30 AM</span>
            </div>
        </div>

        <!-- Barra de Navegación de Períodos Académicos -->
        <div class="bg-[#f7fcf6] p-4 rounded-xl border border-[#c4eec0]/60 flex items-center justify-between gap-4 max-sm:flex-col max-sm:items-start">
            <div class="flex items-center gap-3">
                <div class="size-9 rounded-lg bg-sidebar/10 text-sidebar grid place-items-center shrink-0">
                    <i data-lucide="calendar" class="size-4 stroke-[2.5]"></i>
                </div>
                <div>
                    <span class="text-[10px] font-black uppercase text-text-secondary tracking-wider block">Período Académico Activo</span>
                    <span class="text-[13px] font-black text-sidebar" id="periodo-activo-label">Periodo 1</span>
                </div>
            </div>

            <!-- Selector Simplificado de Períodos -->
            <div class="flex items-center gap-1.5 bg-white p-1 rounded-lg border border-[#c4eec0]/60 shadow-2xs">
                <button type="button" onclick="seleccionarPeriodo('1')" id="btn-p1" 
                        class="px-4 py-2 rounded-md text-[12px] font-bold transition-all cursor-pointer">
                    Periodo 1
                </button>
                <button type="button" onclick="seleccionarPeriodo('2')" id="btn-p2" 
                        class="px-4 py-2 rounded-md text-[12px] font-bold transition-all cursor-pointer">
                    Periodo 2
                </button>
                <button type="button" onclick="seleccionarPeriodo('3')" id="btn-p3" 
                        class="px-4 py-2 rounded-md text-[12px] font-bold transition-all cursor-pointer">
                    Periodo 3
                </button>
            </div>
        </div>

        <!-- Barra de Acciones de Calificaciones -->
        <div class="flex items-center justify-between gap-4 bg-white p-4 rounded-xl border border-[#c4eec0]/40 shadow-2xs">
            <div class="flex items-center gap-3">
                <button type="button" onclick="agregarNota()" class="px-4 py-2 text-xs font-black text-white bg-sidebar hover:brightness-97 rounded-lg transition-all flex items-center gap-1.5 shadow-sm cursor-pointer">
                    <i data-lucide="plus" class="size-4 stroke-[3]"></i>
                    <span>Agregar Nota al Periodo</span>
                </button>
                <span class="text-[11px] font-semibold text-text-secondary">Edite los porcentajes % en el encabezado de cada columna.</span>
            </div>

            <!-- Badge de Estado de Ponderación -->
            <div id="peso-val-badge" class="px-4 py-1.5 bg-pill-green text-sidebar border border-[#8ce383] rounded-full text-[11px] font-black flex items-center gap-1.5 shadow-2xs shrink-0">
                <i data-lucide="check-circle-2" class="size-3.5 stroke-[2.5]"></i>
                <span>Suma de Pesos: <strong id="peso-total-val">100%</strong></span>
            </div>
        </div>

        <!-- Fragmento Tabla Ajustable de Estudiantes y Notas -->
        <div th:replace="~{clases/fragments/tabla-detalle-notas :: tablaDetalleNotas}"></div>

    </div>

    <!-- Script JS para gestión de notas y períodos -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.estudiantesBDData = /*[[${estudiantesData}]]*/ [];
        window.horariosBDData = /*[[${horariosData}]]*/ [];
        /*]]>*/
    </script>
    <script th:src="@{/js/clases-detalle.js}"></script>
</th:block>

</body>
</html>
