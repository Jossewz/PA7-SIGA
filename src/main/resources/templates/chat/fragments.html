<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragmento con el turno de la conversación: Pregunta del usuario + Respuesta del Asistente -->
<th:block th:fragment="turnoConversacion">

    <!-- Mensaje del Usuario -->
    <div class="flex justify-end gap-3 max-w-2xl ml-auto animate-fade-in">
        <div class="flex flex-col items-end gap-1.5">
            <span class="text-[11px] font-bold text-slate-400">Tú</span>
            <div class="bg-sidebar text-white rounded-2xl rounded-tr-none px-4 py-3 text-sm leading-relaxed shadow-xs">
                <p th:text="${mensajeUsuario}">Pregunta del usuario</p>
            </div>
        </div>
        <div class="size-9 rounded-lg bg-sidebar text-white flex items-center justify-center shrink-0 font-bold text-xs">
            👤
        </div>
    </div>

    <!-- Mensaje del Asistente -->
    <div class="flex gap-3 max-w-3xl animate-fade-in">
        <div class="size-9 rounded-lg bg-sidebar/10 text-sidebar flex items-center justify-center shrink-0 font-bold">
            🤖
        </div>
        <div class="flex flex-col gap-1.5 w-full">
            <div class="flex items-center gap-2">
                <span class="text-[11px] font-bold text-slate-500">Asistente SIGA</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-semibold"
                      th:text="${respuestaBot.latenciaMs + ' ms'}">45 ms</span>
                <span th:if="${respuestaBot.procesadoLocalmente}" 
                      class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold">
                    Ollama Local
                </span>
                <span th:unless="${respuestaBot.procesadoLocalmente}" 
                      class="text-[10px] px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-semibold">
                    Motor Normativo Local
                </span>
            </div>

            <!-- Contenido de la Respuesta -->
            <div class="bg-slate-50 border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none p-5 text-sm leading-relaxed space-y-3 shadow-2xs">
                
                <div class="whitespace-pre-line leading-relaxed" th:text="${respuestaBot.respuesta}">
                    Respuesta generada por el asistente.
                </div>

                <!-- Referencias Normativas Citadas -->
                <div th:if="${not #lists.isEmpty(respuestaBot.referenciasNormativas)}" 
                     class="pt-3 mt-3 border-t border-slate-200/80 flex flex-wrap gap-1.5 items-center">
                    <span class="text-[11px] font-bold text-slate-500 mr-1">Fundamento Normativo:</span>
                    <span th:each="ref : ${respuestaBot.referenciasNormativas}"
                          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-md text-[11px] font-bold bg-amber-50 border border-amber-200 text-amber-800"
                          th:text="'📜 ' + ${ref}">
                        ART-FALTA-TIPO-1
                    </span>
                </div>

                <!-- Herramientas Operacionales Invocadas -->
                <div th:if="${not #lists.isEmpty(respuestaBot.herramientasInvocadas)}" 
                     class="pt-2 border-t border-slate-200/50 flex flex-wrap gap-1.5 items-center">
                    <span class="text-[11px] font-bold text-slate-500 mr-1">Herramientas Seguras:</span>
                    <span th:each="tool : ${respuestaBot.herramientasInvocadas}"
                          class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-md text-[10px] font-mono font-bold bg-indigo-50 border border-indigo-200 text-indigo-700"
                          th:text="'⚡ ' + ${tool + '()'}">
                        consultarMisNotas()
                    </span>
                </div>

            </div>
        </div>
    </div>

</th:block>

</body>
</html>
