<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Componente Reutilizable: Cabecera Estándar de Tabla (Inspirado en SEGI)
    Uso:
    <div th:replace="~{components/tables/data-table-header :: header(
        title='Gestión de Estudiantes',
        totalCount=${#lists.size(estudiantesList)},
        itemLabel='ESTUDIANTES',
        searchAction='/estudiantes',
        searchName='buscar',
        searchValue=${buscar},
        searchPlaceholder='Buscar estudiante...'
    )}"></div>
-->
<th:block th:fragment="header(title, totalCount, itemLabel, searchAction, searchName, searchValue, searchPlaceholder)">
    <div class="flex flex-col gap-4 px-6 pt-5 pb-4 lg:flex-row lg:items-center lg:justify-between relative z-30">
        <div class="flex flex-wrap items-center gap-3">
            <h2 th:if="${title != null and !#strings.isEmpty(title)}"
                class="text-base font-bold uppercase tracking-wider text-brand-900"
                th:text="${title}">
                REGISTROS
            </h2>
            <span class="inline-flex items-center rounded-full bg-surface-sunken border border-border px-2.5 py-0.5 text-xs font-bold uppercase text-brand-700 shadow-2xs">
                <span th:text="${(totalCount ?: 0) + ' ' + (itemLabel ?: 'REGISTROS')}">0 REGISTROS</span>
            </span>
        </div>

        <form th:if="${searchAction != null}" method="GET" th:action="@{${searchAction}}" class="flex flex-wrap items-center gap-2.5 m-0 w-full sm:w-auto">
            <div class="relative flex-1 sm:flex-none min-w-[180px]">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-brand-400 pointer-events-none"></i>
                <input type="text"
                       th:name="${searchName ?: 'q'}"
                       th:value="${searchValue}"
                       th:placeholder="${searchPlaceholder ?: 'Buscar...'}"
                       class="w-full sm:w-56 rounded-control border border-border bg-surface-muted py-2 pl-9 pr-3 text-sm text-brand-800 placeholder-brand-400 focus:border-accent-500 focus:outline-none focus:ring-2 focus:ring-accent-100 transition shadow-2xs">
            </div>
            <button type="submit" class="inline-flex items-center gap-1.5 rounded-control bg-sidebar px-3.5 py-2 text-xs font-bold text-white shadow-xs hover:brightness-110 transition cursor-pointer">
                <span>Buscar</span>
            </button>
            <a th:if="${searchValue != null and !#strings.isEmpty(searchValue)}"
               th:href="@{${searchAction}}"
               class="inline-flex items-center rounded-control border border-border bg-surface-muted px-2.5 py-2 text-xs font-medium text-brand-600 hover:bg-surface-sunken transition cursor-pointer"
               title="Limpiar búsqueda">
                <i data-lucide="x" class="size-3.5"></i>
            </a>
        </form>
    </div>
</th:block>

</body>
</html>
