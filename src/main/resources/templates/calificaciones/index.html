<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html(~{::content})}">
<head>
    <title>Boletín de Calificaciones – IEACI</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="flex flex-col gap-6 flex-1">
        <!-- Header -->
        <div class="flex items-center justify-between gap-4 max-sm:flex-col max-sm:items-start">
            <div>
                <h1 class="text-text-primary text-[28px] font-black tracking-tight leading-none mb-1.5">Boletín de Calificaciones</h1>
                <p class="text-text-secondary text-sm font-semibold">Consulta institucional de rendimiento académico por asignatura y período.</p>
            </div>
            
            <!-- Selector y Badge Estudiante -->
            <div class="flex items-center gap-3 max-sm:flex-col max-sm:items-start">
                <form method="get" th:action="@{/calificaciones}" class="flex items-center gap-2 bg-white p-2.5 rounded-xl border border-[#c4eec0]/60 shadow-2xs">
                    <label for="select-estudiante" class="text-[10px] font-black uppercase text-sidebar tracking-wider">Estudiante:</label>
                    <select id="select-estudiante" name="estudianteId" onchange="this.form.submit()" class="h-9 px-3 bg-[#f9fbf8] border border-[#c4eec0] rounded-lg text-xs font-black text-sidebar focus:ring-1 focus:ring-sidebar cursor-pointer">
                        <option th:each="est : ${estudiantes}" th:value="${est.id}" th:text="${est.nombreCompleto}" th:selected="${est.id.toString() == estudianteSeleccionadoId}">Mateo Álvarez</option>
                    </select>
                </form>

                <div class="bg-white rounded-xl border border-[#c4eec0]/60 p-3.5 flex items-center gap-3.5 shadow-sm">
                    <div class="size-10 rounded-lg bg-sidebar/10 text-sidebar grid place-items-center shrink-0">
                        <i data-lucide="user" class="size-5 stroke-[2.5]"></i>
                    </div>
                    <div>
                        <h4 class="text-text-primary text-xs font-black" th:text="${estudianteNombre}">Mateo Álvarez Restrepo</h4>
                        <div class="flex items-center gap-2 text-[11px] font-semibold text-text-secondary mt-0.5">
                            <span th:text="${'Grado: ' + estudianteGrado}">Grado: 11° - 01</span>
                            <span>•</span>
                            <span th:text="${'Doc: ' + estudianteDocumento}">Doc: 1098432101</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Subjects & 3 Periods Table Container -->
        <div class="bg-white rounded-xl border border-[#c4eec0]/40 shadow-soft overflow-hidden">
            <div class="p-4 border-b border-[#c4eec0]/30 bg-[#f7fcf6] flex justify-between items-center">
                <div class="flex items-center gap-2 text-sidebar font-black text-xs uppercase tracking-wider">
                    <i data-lucide="book-open" class="size-4 stroke-[2.5]"></i>
                    <span>Boletín Individual de Calificaciones</span>
                </div>
                <div class="text-[11px] font-bold text-text-secondary">
                    Año Lectivo 2026
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-[12px]">
                    <thead>
                        <tr class="bg-white border-b border-[#c4eec0]/40 text-text-secondary font-black uppercase tracking-wider text-[10px]">
                            <th class="p-4 pl-6">Asignatura</th>
                            <th class="p-4 text-center">Periodo 1</th>
                            <th class="p-4 text-center">Periodo 2</th>
                            <th class="p-4 text-center">Periodo 3</th>
                            <th class="p-4 text-center">Definitiva</th>
                            <th class="p-4 pr-6 text-right">Detalle</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-boletin" class="divide-y divide-[#c4eec0]/20 text-[#243d28]">
                        <!-- Inyectado dinámicamente por calificaciones.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script del módulo de calificaciones -->
    <script th:inline="javascript">
        window.estudianteIdActivo = /*[[${estudianteSeleccionadoId}]]*/ '';
    </script>
    <script th:src="@{/js/calificaciones.js}"></script>
</th:block>

</body>
</html>
