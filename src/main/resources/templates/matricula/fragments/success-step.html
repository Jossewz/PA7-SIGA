<th:block xmlns:th="http://www.thymeleaf.org">
    <div class="p-9 rounded-2xl bg-[#e3f7dc]/50 border border-[#c4eec0] shadow-sm mb-8 text-center flex flex-col items-center justify-center gap-4">
        <span class="w-16 h-16 rounded-full bg-sidebar text-white flex items-center justify-center">
            <i data-lucide="check" class="size-8 stroke-[2.5]"></i>
        </span>
        <div>
            <h2 class="text-sidebar text-[22px] font-black">¡Registro Completado!</h2>
            <p class="text-text-secondary text-[12px] font-semibold mt-2 max-w-md mx-auto">
                El formulario de matrícula ha sido enviado exitosamente. Los documentos entrarán en proceso de validación institucional.
            </p>
        </div>
        <a href="/" class="mt-4 px-6 py-3 bg-sidebar text-white text-xs font-black rounded-lg hover:brightness-97 transition-all flex items-center gap-2 shadow-md">
            <i data-lucide="home" class="size-4"></i>
            <span>Volver al Inicio</span>
        </a>
    </div>
</th:block>
