<div th:fragment="navbar">
    <header class="topbar">
        <form class="topbar-search" action="#" role="search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input
                type="search"
                placeholder="Buscar expedientes, alumnos o reportes..."
                aria-label="Buscar expedientes, alumnos o reportes">
        </form>

        <div class="topbar-actions">
            <button class="icon-button has-dot" type="button" aria-label="Notificaciones">
                <i data-lucide="bell"></i>
            </button>

            <button class="icon-button" type="button" aria-label="Configuracion">
                <i data-lucide="settings"></i>
            </button>

            <div class="user-chip">
                <span>
                    <strong>Admin Usuario</strong>
                    <small>Coordinacion General</small>
                </span>
                <img
                    src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=96&q=80"
                    alt="Admin Usuario">
            </div>
        </div>
    </header>
</div>
