<th:block xmlns:th="http://www.thymeleaf.org">
    <!-- MODAL: VER RESPUESTA Y DESCARGAR ARCHIVO (VISTA ESTUDIANTE) -->
    <div th:fragment="modalVerRespuesta" id="modal-ver-respuesta" class="hidden fixed inset-0 bg-[#0d4117]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-[#c4eec0] shadow-xl max-w-md w-full flex flex-col overflow-hidden transition-all scale-95 opacity-0 duration-300" id="dialog-ver-respuesta">
            <!-- Modal Header -->
            <div class="p-5 border-b border-[#c4eec0]/40 flex justify-between items-center bg-white shrink-0">
                <div class="flex items-center gap-3">
                    <div class="size-10 rounded-xl bg-pill-green text-sidebar grid place-items-center border border-[#8ce383]">
                        <i data-lucide="check-circle-2" class="size-5 stroke-[2.5]"></i>
                    </div>
                    <div>
                        <h3 class="text-sidebar text-base font-black" id="vr-titulo">Certificado Emitido</h3>
                        <span class="text-[10px] font-bold text-text-secondary" id="vr-codigo">CERT-2026-001</span>
                    </div>
                </div>
                <button type="button" onclick="closeModalVerRespuesta()" class="p-1 hover:bg-red-50 text-text-secondary hover:text-alert-red rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="x" class="size-5 stroke-2"></i>
                </button>
            </div>

            <!-- Modal Content -->
            <div class="p-6 space-y-4 bg-white">
                <div class="p-4 rounded-xl bg-[#f7fcf6] border border-[#c4eec0]/60 space-y-2">
                    <h5 class="text-[11px] font-black uppercase text-sidebar tracking-wider flex items-center gap-1.5">
                        <i data-lucide="message-left" class="size-3.5 stroke-2"></i> Mensaje de la Administración:
                    </h5>
                    <p class="text-text-primary text-xs font-semibold leading-relaxed" id="vr-mensaje">
                        Se expide la constancia de matrícula activa para el año lectivo 2026 firmada por Rectoría.
                    </p>
                </div>

                <!-- Tarjeta de Archivo Adjunto -->
                <div id="caja-archivo-adjunto" class="p-4 rounded-xl border border-[#c4eec0] bg-[#f1fbe4]/40 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="size-10 rounded-lg bg-sidebar text-white grid place-items-center shrink-0 shadow-2xs">
                            <i data-lucide="file-text" class="size-5 stroke-[2]"></i>
                        </div>
                        <div class="min-w-0">
                            <h6 class="text-xs font-black text-text-primary text-ellipsis overflow-hidden whitespace-nowrap" id="vr-nombre-archivo">Constancia_Matricula.pdf</h6>
                            <span class="text-[10px] font-bold text-text-secondary">Documento Oficial PDF</span>
                        </div>
                    </div>
                    <a id="btn-descargar-archivo" href="#" target="_blank" download class="px-3.5 py-2 bg-sidebar hover:brightness-97 text-white rounded-lg text-xs font-black transition-all flex items-center gap-1.5 shrink-0 shadow-sm">
                        <i data-lucide="download" class="size-4 stroke-[2.5]"></i>
                        <span>Ver / Descargar</span>
                    </a>
                </div>
            </div>

            <div class="p-4 border-t border-[#c4eec0]/40 flex justify-end bg-[#f7fcf6]">
                <button type="button" onclick="closeModalVerRespuesta()" class="px-5 py-2 text-xs font-black text-text-secondary hover:text-text-primary cursor-pointer">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</th:block>
