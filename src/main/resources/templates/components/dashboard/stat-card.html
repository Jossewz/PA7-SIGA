<th:block xmlns:th="http://www.thymeleaf.org">

    <!-- KPI / TARJETA ESTADÍSTICA -->
    <article th:fragment="statCard(icon, label, value, meta, tone)" 
             class="p-6 rounded-xl bg-white border border-[#c4eec0]/40 shadow-soft transition-all duration-300 hover:-translate-y-1 hover:shadow-md flex flex-col justify-between min-h-[135px]">
        <div class="flex items-center justify-between gap-3 mb-4">
            <span class="w-9 h-9 grid place-items-center rounded-lg"
                  th:classappend="${tone == 'warning'} ? 'bg-icon-warning text-[#c93831]' : 'bg-icon-green text-sidebar'">
                <i th:attr="data-lucide=${icon}" class="size-5 shrink-0 stroke-[2.2]"></i>
            </span>
            <span class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wide leading-none"
                  th:classappend="${tone == 'warning'} ? 'bg-pill-red text-alert-red' : 'bg-pill-green text-sidebar'"
                  th:text="${meta}">+4%</span>
        </div>
        <div>
            <p class="text-text-secondary text-[11px] font-extrabold uppercase tracking-wide mb-1" th:text="${label}">Total Estudiantes</p>
            <strong class="text-2xl font-black text-sidebar leading-none" th:text="${value}">1,284</strong>
        </div>
    </article>

</th:block>
