<!DOCTYPE html>
<html
lang="es"
xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title
        th:text="${title ?: 'SIGA'}">
        SIGA
    </title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet"
          th:href="@{/css/globals/global.css}">

    <!-- CSS LAYOUT -->
    <link rel="stylesheet"
          th:href="@{/css/layouts/base.css}">

    <link rel="stylesheet"
          th:href="@{/css/layouts/sidebar.css}">

    <link rel="stylesheet"
          th:href="@{/css/layouts/navbar.css}">

    <!-- CSS DINÁMICO -->
    <th:block
      th:replace="${pageCss}">
    </th:block>

    <!-- HTMX -->
    <script
      src="https://unpkg.com/htmx.org">
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside
      th:replace="
      ~{layouts/sidebar :: sidebar(
        activePage='dashboard',
        bottomUrl='/soporte',
        bottomText='Soporte Técnico'
      )}">
    </aside>

    <!-- CONTENIDO -->
    <main class="main-content">

        <!-- NAVBAR -->
        <header
          th:replace="
          ~{layouts/navbar :: navbar}">
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <section
          class="page-content">

            <th:block
              th:replace="${content}">
            </th:block>

        </section>

    </main>

</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
