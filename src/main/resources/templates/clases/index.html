<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html(~{::content})}">
<head>
    <title>Gestión de Cursos – IEACI</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="flex flex-col gap-6">
        <!-- Flash messages -->
        <div th:if="${mensajeExito}" class="p-4 rounded-xl bg-green-50 border border-green-200 text-xs font-bold text-sidebar flex items-center gap-2">
            <i data-lucide="check-circle" class="size-4.5 text-sidebar"></i>
            <span th:text="${mensajeExito}">Éxito</span>
        </div>
        <div th:if="${mensajeError}" class="p-4 rounded-xl bg-red-50 border border-red-200 text-xs font-bold text-alert-red flex items-center gap-2">
            <i data-lucide="alert-triangle" class="size-4.5 text-alert-red"></i>
            <span th:text="${mensajeError}">Error</span>
        </div>

        <!-- Header General -->
        <div class="flex items-center justify-between gap-4 max-sm:flex-col max-sm:items-start mb-2">
            <div>
                <h1 class="text-text-primary text-[28px] font-black tracking-tight leading-none mb-1.5">Gestión de Cursos</h1>
                <p class="text-text-secondary text-sm font-semibold">Configuración de grados, directores de grupo, horarios y planillas académicas.</p>
            </div>
        </div>

        <!-- ======================== DATA TABLE CARD (Estilo SEGI con Paleta SIGA) ======================== -->
        <div class="rounded-surface border border-border bg-white shadow-card transition relative">

            <!-- Cabecera: Título + Contador + Acción Primaria -->
            <div class="flex flex-col gap-4 px-6 pt-5 pb-4 sm:flex-row sm:items-center sm:justify-between relative z-30">
                <div class="flex flex-wrap items-center gap-3">
                    <h2 class="text-base font-bold uppercase tracking-wider text-brand-900">Cursos Habilitados</h2>
                    <span class="inline-flex items-center rounded-full bg-surface-sunken border border-border px-2.5 py-0.5 text-xs font-bold uppercase text-brand-700 shadow-2xs">
                        <span th:text="${(cursosList != null ? #lists.size(cursosList) : 0) + ' CURSOS'}">0 CURSOS</span>
                    </span>
                </div>

                <div class="flex items-center gap-2">
                    <button type="button" onclick="openCursoModal()"
                            class="inline-flex items-center gap-2 rounded-control bg-sidebar px-4 py-2 text-xs font-bold text-white shadow-xs hover:brightness-110 transition cursor-pointer shrink-0">
                        <i data-lucide="plus-circle" class="size-4 stroke-[2.2]"></i>
                        <span>Nuevo Curso</span>
                    </button>
                </div>
            </div>

            <!-- Tabla de Datos Desktop -->
            <div class="w-full border-t border-border relative rounded-b-surface overflow-visible">
                <table class="tabla-siga w-full text-left text-sm bg-surface">
                    <thead class="sticky top-0 z-20 border-b border-border-strong bg-surface-sunken text-[11px] font-bold uppercase tracking-wider text-brand-700 [&_th]:bg-surface-sunken">
                        <tr>
                            <th class="py-3 px-4 pl-6 w-28">Grado</th>
                            <th class="py-3 px-4 w-24">Grupo</th>
                            <th class="py-3 px-4">Director de Grupo</th>
                            <th class="py-3 px-4 text-center w-28">Cupos</th>
                            <th class="py-3 px-4 text-center w-32">Estudiantes</th>
                            <th class="py-3 px-4 text-center w-40">Horario</th>
                            <th class="py-3 px-4 pr-6 text-right w-24">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="text-brand-900">
                        <!-- Estado Vacío -->
                        <th:block th:if="${cursosList == null || #lists.isEmpty(cursosList)}">
                            <tr th:replace="~{components/tables/empty-state :: emptyState(colspan=7, title='No hay cursos configurados', description='Aún no se han definido grados ni grupos académicos en la institución.', resetUrl='/clases')}"></tr>
                        </th:block>

                        <!-- Filas de Cursos -->
                        <tr th:each="c : ${cursosList}" 
                            class="transition-colors cursor-pointer group curso-tr"
                            th:data-codigo="${c.codigoCurso}"
                            onclick="handleRowClick(this, event)">
                            
                            <!-- Grado -->
                            <td class="py-3 px-4 pl-6 font-black text-sidebar text-sm">
                                <div class="flex items-center gap-2">
                                    <span th:text="${c.grado}">11°</span>
                                    <span class="text-[10px] font-bold text-brand-500 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-0.5">
                                        <i data-lucide="external-link" class="size-3 stroke-2"></i> Abrir
                                    </span>
                                </div>
                            </td>

                            <!-- Grupo -->
                            <td class="py-3 px-4">
                                <span class="px-2 py-0.5 bg-accent-50 text-sidebar border border-accent-200 rounded-md font-black text-xs" th:text="${c.codigoCurso}">11-01</span>
                            </td>

                            <!-- Director -->
                            <td class="py-3 px-4 font-bold text-brand-900 text-xs" th:text="${c.director}">Jorge Eliécer Rojas</td>

                            <!-- Cupos -->
                            <td class="py-3 px-4 font-semibold text-brand-600 text-xs text-center" th:text="${c.cuposMaximos}">30</td>

                            <!-- Estudiantes -->
                            <td class="py-3 px-4 font-semibold text-brand-600 text-xs text-center">
                                <span class="font-bold text-sidebar" th:text="${c.estudiantes}">28</span> / <span th:text="${c.cuposMaximos}">30</span>
                            </td>

                            <!-- Horario -->
                            <td class="py-3 px-4 text-center">
                                <button type="button" 
                                        th:data-id="${c.id}"
                                        th:data-codigo="${c.codigoCurso}"
                                        th:data-tiene="${c.tieneHorario}"
                                        onclick="handleHorarioBtn(this, event)"
                                        class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wide leading-none transition-all inline-flex items-center gap-1.5 cursor-pointer shadow-2xs"
                                        th:classappend="${c.tieneHorario} ? 'bg-pill-green text-sidebar border border-[#8ce383] hover:brightness-95' : 'bg-amber-100 text-amber-800 border border-amber-300 hover:bg-amber-200'">
                                    <i data-lucide="clock" class="size-3 stroke-[2.5]"></i>
                                    <span th:text="${c.tieneHorario} ? 'Asignado' : 'Sin Horario'">Sin Horario</span>
                                </button>
                            </td>

                            <!-- Acciones -->
                            <td class="py-3 px-4 pr-6 text-right">
                                <div class="flex justify-end items-center gap-1.5">
                                    <button type="button" 
                                            th:data-codigo="${c.codigoCurso}"
                                            onclick="handleGestionBtn(this, event)"
                                            class="p-1.5 hover:bg-surface-sunken rounded-control transition text-brand-600 hover:text-sidebar cursor-pointer" title="Gestionar Notas y Asistencia">
                                        <i data-lucide="clipboard-list" class="size-4 stroke-2"></i>
                                    </button>
                                    <button type="button" 
                                            th:data-id="${c.id}"
                                            th:data-codigo="${c.codigoCurso}"
                                            th:data-grado="${c.grado}"
                                            th:data-jornada="${c.jornada}"
                                            th:data-cupos="${c.cuposMaximos}"
                                            th:data-directorid="${c.directorId}"
                                            onclick="handleEditarCursoBtn(this, event)"
                                            class="p-1.5 hover:bg-surface-sunken rounded-control transition text-brand-600 hover:text-sidebar cursor-pointer" title="Editar Parámetros">
                                        <i data-lucide="edit" class="size-4 stroke-2"></i>
                                    </button>
                                    <form th:action="@{/clases/eliminar}" method="post" class="inline" onsubmit="event.stopPropagation(); return confirm('¿Está seguro de eliminar este curso?');">
                                        <input type="hidden" name="cursoId" th:value="${c.id}" />
                                        <button type="submit" onclick="event.stopPropagation();" class="p-1.5 hover:bg-red-50 rounded-lg transition-colors text-alert-red cursor-pointer" title="Eliminar curso">
                                            <i data-lucide="trash-2" class="size-4 stroke-[2]"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Fragmentos Modales -->
    <div th:replace="~{clases/fragments/modal-curso :: modalCurso}"></div>
    <div th:replace="~{clases/fragments/modal-horario :: modalHorario}"></div>

    <!-- Script del listado de cursos -->
    <script th:inline="javascript">
        window.materiasGlobales = /*[[${materiasList}]]*/ [];
        window.docentesGlobales = /*[[${docentesList}]]*/ [];
    </script>
    <script th:src="@{/js/clases.js(v='2.1')}"></script>
</th:block>

</body>
</html>
