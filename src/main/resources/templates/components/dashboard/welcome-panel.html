<th:block xmlns:th="http://www.thymeleaf.org">

    <!-- PANEL DE BIENVENIDA (Versión un poco más clara y luminosa) -->
    <section th:fragment="welcomePanel(adminName, dateText)" 
             class="relative min-h-[140px] flex items-center justify-between p-8 rounded-2xl overflow-hidden bg-gradient-to-r from-[#18662b] via-[#1c7532] to-[#155a26] text-white shadow-soft border border-white/15">
        <div class="z-10">
            <h1 class="mb-2 text-white text-3xl md:text-4xl leading-none font-black tracking-tight" 
                th:text="'Bienvenido, ' + ${adminName} + '.'">Bienvenido, Admin.</h1>
            <p class="text-white/90 text-sm font-semibold" th:text="${dateText}">Resumen de analítica institucional para hoy.</p>
        </div>
        <i data-lucide="zap" 
           class="absolute -right-6 -bottom-8 w-64 h-48 text-white/10 fill-current stroke-0 -rotate-9 pointer-events-none" 
           aria-hidden="true"></i>
    </section>

</th:block>
