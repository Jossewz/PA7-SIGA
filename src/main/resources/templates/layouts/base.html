<!DOCTYPE html>
<html
lang="es"
xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
th:fragment="html(content)">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title
        th:text="${title ?: 'SIGA'}">
        SIGA
    </title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet"
          th:href="@{/css/output.css}">

    <!-- Estilos defensivos para prevención de CLS y soporte Alpine x-cloak -->
    <style>
        [x-cloak] { display: none !important; }
        html.sidebar-init-collapsed #sidebar-desktop {
            width: 74px !important;
            padding: 32px 8px 24px !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-label,
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-brand-logo {
            display: none !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-brand-header {
            justify-content: center !important;
            align-items: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop #sidebar-toggle-btn {
            margin: 0 auto !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-nav-item {
            justify-content: center !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }
        html.sidebar-init-collapsed #sidebar-desktop .sidebar-chevron {
            transform: rotate(180deg) !important;
        }
    </style>

    <!-- Script temprano de prevención de parpadeo de layout (CLS = 0) -->
    <script>
        try {
            if (localStorage.getItem('siga_sidebar_open') === 'false') {
                document.documentElement.classList.add('sidebar-init-collapsed');
            }
        } catch(e) {}
    </script>

    <!-- Scripts locales (cero dependencias de CDN externas) -->
    <script th:src="@{/js/htmx.min.js}"></script>
    <script th:src="@{/js/lucide.min.js}"></script>
    <script defer th:src="@{/js/alpine.min.js}"></script>
</head>

<body>

<div class="flex min-h-screen bg-page-bg max-md:flex-col"
     x-data="{
         sidebarOpen: (function() {
             try {
                 var val = localStorage.getItem('siga_sidebar_open');
                 return val !== null ? val === 'true' : (window.innerWidth >= 1024);
             } catch(e) {
                 return true;
             }
         })(),
         mobileOpen: false,
         toggleSidebar() {
             this.sidebarOpen = !this.sidebarOpen;
             try {
                 localStorage.setItem('siga_sidebar_open', this.sidebarOpen);
             } catch(e) {}
             var aside = document.getElementById('sidebar-desktop');
             if (aside) {
                 if (this.sidebarOpen) {
                     aside.classList.remove('is-collapsed');
                     document.documentElement.classList.remove('sidebar-init-collapsed');
                 } else {
                     aside.classList.add('is-collapsed');
                     document.documentElement.classList.add('sidebar-init-collapsed');
                 }
             }
         }
     }">

    <!-- SIDEBAR -->
    <aside
      th:replace="
      ~{layouts/sidebar :: sidebar(
        activePage=${activePage ?: ''},
        bottomText='',
        bottomUrl=''
      )}">
    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1 min-w-0 flex flex-col">

        <!-- NAVBAR -->
        <header
          th:replace="
          ~{layouts/navbar :: navbar}">
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <section
          class="flex-1 p-[28px_32px_32px] max-md:p-5 flex flex-col">

            <!-- Banner Alerta Sin Acceso -->
            <div th:if="${param.sinAcceso}" class="mb-5 p-4 rounded-xl bg-amber-50 border border-amber-300 text-xs font-bold text-amber-900 flex items-center gap-3 shadow-xs">
                <i data-lucide="shield-alert" class="size-5 text-amber-600 shrink-0"></i>
                <span>Acceso Restringido: No cuentas con permisos asignados para acceder a la vista requerida (<strong th:text="${param.sinAcceso}"></strong>). Contacta a la administración institucional si requieres habilitar este acceso.</span>
            </div>

            <th:block
              th:replace="${content}">
            </th:block>

        </section>

    </main>

</div>

<!-- Funciones globales de respaldo para interactividad garantizada -->
<script>
    window.toggleSigaSidebar = function() {
        var aside = document.getElementById('sidebar-desktop');
        if (!aside) return;
        var isCurrentlyCollapsed = aside.classList.contains('is-collapsed') || document.documentElement.classList.contains('sidebar-init-collapsed');
        if (isCurrentlyCollapsed) {
            aside.classList.remove('is-collapsed');
            document.documentElement.classList.remove('sidebar-init-collapsed');
            try { localStorage.setItem('siga_sidebar_open', 'true'); } catch(e) {}
        } else {
            aside.classList.add('is-collapsed');
            document.documentElement.classList.add('sidebar-init-collapsed');
            try { localStorage.setItem('siga_sidebar_open', 'false'); } catch(e) {}
        }
    };

    window.openSigaMobileDrawer = function() {
        var drawer = document.getElementById('mobile-sidebar-drawer');
        if (drawer) drawer.style.display = 'block';
    };

    window.closeSigaMobileDrawer = function() {
        var drawer = document.getElementById('mobile-sidebar-drawer');
        if (drawer) drawer.style.display = 'none';
    };

    if (window.lucide) lucide.createIcons();
    document.addEventListener('htmx:afterSwap', function() {
        if (window.lucide) lucide.createIcons();
    });
</script>

</body>
</html>
