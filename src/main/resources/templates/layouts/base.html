<!DOCTYPE html>
<html
lang="es"
xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
th:fragment="html(content)">


<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title
        th:text="${title ?: 'SIGA'}">
        SIGA
    </title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet"
          th:href="@{/css/output.css}">

    <!-- HTMX v2 (pinned) -->
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>

    <!-- Lucide Icons (pinned) -->
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>

<body>

<div class="flex min-h-screen bg-page-bg max-md:flex-col">

    <!-- SIDEBAR -->
    <aside
      th:replace="
      ~{layouts/sidebar :: sidebar(
        activePage=${activePage ?: 'dashboard'},
        bottomText='',
        bottomUrl=''
      )}">
    </aside>

    <!-- CONTENIDO -->
    <main class="flex-1 min-w-0 flex flex-col">

        <!-- NAVBAR -->
        <header
          th:replace="
          ~{layouts/navbar :: navbar}">
        </header>

        <!-- CONTENIDO DINÁMICO -->
        <section
          class="flex-1 p-[28px_32px_32px] max-md:p-5 flex flex-col">

            <!-- Banner Alerta Sin Acceso -->
            <div th:if="${param.sinAcceso}" class="mb-5 p-4 rounded-xl bg-amber-50 border border-amber-300 text-xs font-bold text-amber-900 flex items-center gap-3 shadow-xs">
                <i data-lucide="shield-alert" class="size-5 text-amber-600 shrink-0"></i>
                <span>Acceso Restringido: No cuentas con permisos asignados para acceder a la vista requerida (<strong th:text="${param.sinAcceso}"></strong>). Contacta a la administración institucional si requieres habilitar este acceso.</span>
            </div>

            <th:block
              th:replace="${content}">
            </th:block>

        </section>

    </main>

</div>

<script>
    if (window.lucide) lucide.createIcons();
    document.addEventListener('htmx:afterSwap', function() {
        if (window.lucide) lucide.createIcons();
    });
</script>

</body>
</html>
