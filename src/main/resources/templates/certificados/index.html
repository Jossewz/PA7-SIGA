<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html(~{::content})}">
<head>
    <title>Certificados – IEACI</title>
</head>
<body>

<th:block th:fragment="content">
    <div class="flex flex-col gap-6 flex-1">
        <!-- Header -->
        <div>
            <h1 class="text-text-primary text-[28px] font-black tracking-tight leading-none mb-1.5">Generación de Certificados</h1>
            <p class="text-text-secondary text-sm font-semibold">Expedición de certificados de estudio, constancias de matrícula y Paz y Salvo.</p>
        </div>

        <!-- Main Card Container -->
        <div class="bg-white rounded-xl border border-[#c4eec0]/40 shadow-soft flex-1 p-8 flex flex-col items-center justify-center text-center">
            <div class="size-16 rounded-2xl bg-[#f1fbe4] text-sidebar grid place-items-center mb-4 border border-[#c4eec0]">
                <i data-lucide="badge-check" class="size-8 stroke-2"></i>
            </div>
            <h2 class="text-text-primary text-lg font-black">Módulo de Certificados</h2>
            <p class="text-text-secondary text-xs font-semibold max-w-md mt-1.5">Generación e impresión de constancias oficiales de estudiantes matriculados.</p>
        </div>
    </div>
</th:block>

</body>
</html>
