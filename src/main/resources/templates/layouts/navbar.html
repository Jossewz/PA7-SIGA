<div th:fragment="navbar">
    <header class="h-16 flex items-center justify-between gap-6 px-8 bg-page-bg max-md:h-auto max-md:items-stretch max-md:flex-col max-md:px-5 max-md:pt-4 max-md:pb-0">
        <form class="w-[min(425px,100%)] h-9 flex items-center gap-2.5 px-3.5 rounded-[10px] bg-white text-[#7c8d80] max-md:w-full" action="#" role="search">
            <i data-lucide="search" class="size-[17px] shrink-0" aria-hidden="true"></i>
            <input
                type="search"
                class="w-full bg-transparent text-[#183b1e] text-[12px] placeholder-search-placeholder"
                placeholder="Buscar expedientes, alumnos o reportes..."
                aria-label="Buscar expedientes, alumnos o reportes">
        </form>

        <div class="flex items-center gap-4 ml-auto max-md:w-full max-md:justify-end">
            <button class="relative w-7 h-7 grid place-items-center rounded-full bg-transparent text-text-primary cursor-pointer after:content-[''] after:absolute after:top-1 after:right-[5px] after:w-[7px] after:h-[7px] after:border-[2px] after:border-page-bg after:rounded-full after:bg-notification-red" type="button" aria-label="Notificaciones">
                <i data-lucide="bell" class="size-[18px] stroke-2"></i>
            </button>

            <button class="relative w-7 h-7 grid place-items-center rounded-full bg-transparent text-text-primary cursor-pointer" type="button" aria-label="Configuracion">
                <i data-lucide="settings" class="size-[18px] stroke-2"></i>
            </button>

            <!-- Perfil de Usuario con Menú Desplegable -->
            <div class="relative" id="profile-dropdown-wrapper">
                <button type="button" 
                        id="profile-dropdown-btn"
                        onclick="toggleProfileDropdown(event)"
                        class="flex items-center gap-2.5 text-text-primary text-right p-1.5 -mr-1.5 rounded-xl hover:bg-white/60 transition-all duration-200 cursor-pointer group focus:outline-none focus:ring-2 focus:ring-[#145f22]/20"
                        aria-expanded="false"
                        aria-haspopup="true">
                    <span class="grid gap-[1px]">
                        <strong class="text-[11px] leading-[1.1] font-extrabold group-hover:text-sidebar transition-colors" th:text="${currentUser != null ? currentUser.email : 'Usuario'}">Usuario</strong>
                        <small class="text-text-secondary text-[9px] leading-[1.1] font-semibold" th:text="${currentRoleName ?: 'Acceso'}">Rol</small>
                    </span>
                    <div class="w-9 h-9 border-[2px] border-[#0f6a3d] rounded-full bg-[#145f22] text-white flex items-center justify-center text-xs font-black uppercase shadow-xs group-hover:scale-105 transition-transform">
                        <span th:text="${currentUser != null && currentUser.email != null ? #strings.substring(currentUser.email,0,1) : 'U'}">U</span>
                    </div>
                    <i data-lucide="chevron-down" class="size-3.5 text-text-secondary group-hover:text-sidebar transition-transform duration-200" id="profile-chevron"></i>
                </button>

                <!-- Menú Desplegable Flotante -->
                <div id="profile-dropdown-menu" 
                     class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl border border-[#c4eec0] shadow-xl z-50 overflow-hidden transform opacity-0 scale-95 transition-all duration-200">
                    
                    <!-- Encabezado con Información de Usuario -->
                    <div class="p-3.5 bg-[#f7fcf6] border-b border-[#c4eec0]/40">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 border-2 border-[#0f6a3d] rounded-full bg-[#145f22] text-white flex items-center justify-center text-xs font-black uppercase shrink-0">
                                <span th:text="${currentUser != null && currentUser.email != null ? #strings.substring(currentUser.email,0,1) : 'U'}">U</span>
                            </div>
                            <div class="min-w-0 flex-1">
                                <p class="text-[11px] font-black text-text-primary truncate" th:text="${currentUser != null ? currentUser.email : 'Usuario'}">usuario@ieaci.edu.co</p>
                                <span class="text-[10px] font-bold text-sidebar" th:text="${currentRoleName ?: 'Acceso'}">Administrador</span>
                            </div>
                        </div>
                    </div>

                    <!-- Acción Cerrar Sesión -->
                    <div class="p-1.5">
                        <form th:action="@{/logout}" method="post" class="w-full m-0">
                            <button type="submit" 
                                    class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-bold text-alert-red hover:bg-red-50 transition-colors cursor-pointer text-left">
                                <div class="size-6 rounded-lg bg-red-100/70 text-alert-red grid place-items-center shrink-0">
                                    <i data-lucide="log-out" class="size-3.5 stroke-2"></i>
                                </div>
                                <span>Cerrar Sesión</span>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </header>

    <script>
        function toggleProfileDropdown(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('profile-dropdown-menu');
            const btn = document.getElementById('profile-dropdown-btn');
            const chevron = document.getElementById('profile-chevron');
            if (!menu) return;

            const isHidden = menu.classList.contains('hidden');
            if (isHidden) {
                menu.classList.remove('hidden');
                requestAnimationFrame(() => {
                    menu.classList.remove('opacity-0', 'scale-95');
                    menu.classList.add('opacity-100', 'scale-100');
                });
                if (chevron) chevron.classList.add('rotate-180');
                if (btn) btn.setAttribute('aria-expanded', 'true');
                if (window.lucide) lucide.createIcons();
            } else {
                closeProfileDropdown();
            }
        }

        function closeProfileDropdown() {
            const menu = document.getElementById('profile-dropdown-menu');
            const btn = document.getElementById('profile-dropdown-btn');
            const chevron = document.getElementById('profile-chevron');
            if (!menu || menu.classList.contains('hidden')) return;

            menu.classList.remove('opacity-100', 'scale-100');
            menu.classList.add('opacity-0', 'scale-95');
            if (chevron) chevron.classList.remove('rotate-180');
            if (btn) btn.setAttribute('aria-expanded', 'false');

            setTimeout(() => {
                menu.classList.add('hidden');
            }, 150);
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('profile-dropdown-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                closeProfileDropdown();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeProfileDropdown();
            }
        });
    </script>
</div>
