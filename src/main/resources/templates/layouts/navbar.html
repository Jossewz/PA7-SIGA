<div th:fragment="navbar">
    <header class="h-16 flex items-center justify-between gap-6 px-8 bg-page-bg max-md:h-auto max-md:items-stretch max-md:flex-col max-md:px-5 max-md:pt-4 max-md:pb-0">
        <form class="w-[min(425px,100%)] h-9 flex items-center gap-2.5 px-3.5 rounded-[10px] bg-white text-[#7c8d80] max-md:w-full" action="#" role="search">
            <i data-lucide="search" class="size-[17px] shrink-0" aria-hidden="true"></i>
            <input
                type="search"
                class="w-full bg-transparent text-[#183b1e] text-[12px] placeholder-search-placeholder"
                placeholder="Buscar expedientes, alumnos o reportes..."
                aria-label="Buscar expedientes, alumnos o reportes">
        </form>

        <div class="flex items-center gap-4 ml-auto max-md:w-full max-md:justify-end">
            <button class="relative w-7 h-7 grid place-items-center rounded-full bg-transparent text-text-primary cursor-pointer after:content-[''] after:absolute after:top-1 after:right-[5px] after:w-[7px] after:h-[7px] after:border-[2px] after:border-page-bg after:rounded-full after:bg-notification-red" type="button" aria-label="Notificaciones">
                <i data-lucide="bell" class="size-[18px] stroke-2"></i>
            </button>

            <button class="relative w-7 h-7 grid place-items-center rounded-full bg-transparent text-text-primary cursor-pointer" type="button" aria-label="Configuracion">
                <i data-lucide="settings" class="size-[18px] stroke-2"></i>
            </button>

            <div class="flex items-center gap-2.5 text-text-primary text-right">
                <span class="grid gap-[1px]">
                    <strong class="text-[11px] leading-[1.1] font-extrabold" th:text="${currentUser != null ? currentUser.email : 'Usuario'}">Usuario</strong>
                    <small class="text-text-secondary text-[9px] leading-[1.1] font-semibold" th:text="${currentRoleName ?: 'Acceso'}">Rol</small>
                </span>
                <div class="w-9 h-9 border-[2px] border-[#0f6a3d] rounded-full bg-[#145f22] text-white flex items-center justify-center text-xs font-black uppercase">
                    <span th:text="${currentUser != null && currentUser.email != null ? #strings.substring(currentUser.email,0,1) : 'U'}">U</span>
                </div>
            </div>
        </div>
    </header>
</div>
