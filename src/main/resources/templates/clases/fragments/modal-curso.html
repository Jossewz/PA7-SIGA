<th:block xmlns:th="http://www.thymeleaf.org">
    <!-- MODAL REGISTRAR CURSO -->
    <div th:fragment="modalCurso" id="curso-modal" class="hidden fixed inset-0 bg-[#0d4117]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-[#c4eec0] shadow-xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden transition-all scale-95 opacity-0 duration-300" id="curso-modal-dialog">
            
            <!-- Modal Header -->
            <div class="p-6 border-b border-[#c4eec0]/40 flex justify-between items-center bg-white shrink-0">
                <div>
                    <h3 class="text-sidebar text-[18px] font-black">Crear Nuevo Curso</h3>
                    <p class="text-text-secondary text-[11px] font-bold">Seleccione el grado. La secuencia numérica del grupo se generará automáticamente.</p>
                </div>
                <button type="button" onclick="closeCursoModal()" class="p-1 hover:bg-red-50 text-text-secondary hover:text-alert-red rounded-lg transition-colors cursor-pointer">
                    <i data-lucide="x" class="size-5 stroke-2"></i>
                </button>
            </div>

            <!-- Modal Content (Forms) -->
            <div class="p-6 overflow-y-auto flex-1 bg-white">
                <form id="form-register-curso" class="grid grid-cols-2 gap-x-5 gap-y-4" onsubmit="event.preventDefault(); closeCursoModal();">
                    
                    <!-- Campo Grado (1° a 11°) -->
                    <div class="col-span-2 flex flex-col">
                        <label for="c-grade" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Grado Académico <span class="text-sidebar">*</span>
                        </label>
                        <select id="c-grade" name="grado" required class="w-full p-3 bg-white border border-[#c4eec0] rounded-xl text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="1°">1° de Primaria</option>
                            <option value="2°">2° de Primaria</option>
                            <option value="3°">3° de Primaria</option>
                            <option value="4°">4° de Primaria</option>
                            <option value="5°">5° de Primaria</option>
                            <option value="6°">6° de Bachillerato</option>
                            <option value="7°">7° de Bachillerato</option>
                            <option value="8°">8° de Bachillerato</option>
                            <option value="9°">9° de Bachillerato</option>
                            <option value="10°">10° de Bachillerato</option>
                            <option value="11°" selected>11° de Bachillerato</option>
                        </select>
                    </div>
                    
                    <!-- Nota informativa de secuencia automática -->
                    <div class="col-span-2 p-3 rounded-lg bg-[#f7fcf6] border border-[#c4eec0]/60 flex items-center gap-2.5 text-text-secondary text-[11px]">
                        <i data-lucide="info" class="size-4 text-sidebar shrink-0 stroke-[2.5]"></i>
                        <span>El código del grupo se creará en secuencia automática (ej: <strong>11-01</strong>, <strong>11-02</strong>).</span>
                    </div>

                    <div class="col-span-2 flex flex-col">
                        <label for="c-jornada" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Jornada <span class="text-sidebar">*</span>
                        </label>
                        <select id="c-jornada" name="jornada" required class="w-full p-3 bg-white border border-[#c4eec0] rounded-xl text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="Mañana">Mañana (07:00 - 12:30)</option>
                            <option value="Tarde">Tarde (12:30 - 18:00)</option>
                        </select>
                    </div>
                    
                    <div class="col-span-2 flex flex-col">
                        <label for="c-director" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Director de Grupo <span class="text-sidebar">*</span>
                        </label>
                        <select id="c-director" name="director" required class="w-full p-3 bg-white border border-[#c4eec0] rounded-xl text-xs font-bold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                            <option value="Jorge Eliécer Rojas">Jorge Eliécer Rojas (Docente)</option>
                            <option value="Ana María Sánchez">Ana María Sánchez (Docente)</option>
                            <option value="Carlos Mendoza">Carlos Mendoza (Docente)</option>
                            <option value="Luis Felipe Gómez">Luis Felipe Gómez (Docente)</option>
                        </select>
                    </div>
                    
                    <div class="flex flex-col">
                        <label for="c-cupos" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Cupos Máximos <span class="text-sidebar">*</span>
                        </label>
                        <input type="number" id="c-cupos" name="cuposMaximos" value="35" required class="w-full p-3 bg-white border border-[#c4eec0] rounded-xl text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>
                    
                    <div class="flex flex-col">
                        <label for="c-year" class="text-text-primary text-[10px] font-black tracking-wider uppercase mb-1">
                            Año Lectivo <span class="text-sidebar">*</span>
                        </label>
                        <input type="number" id="c-year" name="año" value="2026" required class="w-full p-3 bg-white border border-[#c4eec0] rounded-xl text-xs font-semibold text-text-primary focus:ring-1 focus:ring-sidebar focus:outline-none">
                    </div>

                </form>
            </div>

            <!-- Modal Footer -->
            <div class="p-6 border-t border-[#c4eec0]/40 flex justify-between items-center bg-[#f7fcf6] shrink-0">
                <button type="button" onclick="closeCursoModal()" class="px-5 py-3 text-xs font-black text-text-secondary bg-transparent hover:bg-red-50 hover:text-alert-red rounded-lg transition-all cursor-pointer">
                    Cancelar
                </button>
                <button type="submit" form="form-register-curso" class="px-6 py-3 text-xs font-black text-white bg-sidebar hover:brightness-97 rounded-lg transition-all flex items-center gap-2 shadow-md cursor-pointer">
                    <i data-lucide="check" class="size-4 stroke-[2.5]"></i>
                    <span>Crear Curso</span>
                </button>
            </div>

        </div>
    </div>
</th:block>
