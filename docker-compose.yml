services:
  db:
    image: postgres:18.3
    container_name: siga-postgres
    environment:
      POSTGRES_DB: siga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: siga
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - siga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d siga"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: siga-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/siga
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: siga
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin123
      MINIO_BUCKET: siga
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - siga_maven_cache:/root/.m2
    command: sh ./mvnw spring-boot:run -Dtailwind.phase=none

  pgadmin:
    image: dpage/pgadmin4
    container_name: siga-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siga.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - siga_pgadmin_data:/var/lib/pgadmin

  minio:
    image: minio/minio
    container_name: siga-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - siga_minio_data:/data

  frontend:
    image: node:22-alpine
    container_name: siga-vite
    profiles:
      - frontend
    working_dir: /workspace/frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - siga_node_modules:/workspace/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  siga_postgres_data:
  siga_maven_cache:
  siga_node_modules:
  siga_pgadmin_data:
  siga_minio_data:
