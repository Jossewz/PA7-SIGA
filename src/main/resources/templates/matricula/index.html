<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html(~{::content})}">

<head>
    <title th:text="${title ?: 'Formulario de Matrícula – IEACI'}">Formulario de Matrícula</title>
</head>

<body>

<th:block th:fragment="content">
    <section class="w-full grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_minmax(300px,360px)] gap-[clamp(24px,2vw,36px)] m-0 items-stretch">

        <!-- COLUMNA PRINCIPAL DE FORMULARIOS -->
        <div class="min-w-0 flex flex-col">
            <!-- Encabezado del Formulario -->
            <div class="mb-4">
                <h1 class="text-[#0d4117] text-[28px] font-black tracking-tight mb-1.5">Formulario de Matrícula – IEACI</h1>
                <p class="text-text-secondary text-sm font-semibold">Gestión de expedientes académicos y registro estudiantil 2024</p>
            </div>

            <!-- Barra de Progreso (Contenedor Dinámico) -->
            <div id="progress-bar-container" class="w-full">
                <div th:replace="~{components/forms/progress-bar :: progressBar(${currentStep})}"></div>
            </div>

            <!-- CONTENEDOR DINÁMICO DE PASOS (HTMX) -->
            <div id="step-container" class="transition-all duration-300">
                <div th:replace="~{matricula/fragments/step-personal :: stepPersonal}"></div>
            </div>

        </div>

        <!-- COLUMNA DERECHA: SIDEBAR DE RESUMEN -->
        <aside class="flex flex-col xl:pt-16 pt-0 xl:h-full">
            <!-- Resumen de Registro (Contenedor Dinámico) -->
            <div id="summary-container" class="flex-1 flex flex-col h-full">
                <div th:replace="~{components/forms/step-summary :: stepSummary}"></div>
            </div>
        </aside>

    </section>

    <!-- Inicializar iconos y re-renderizar tras cada swap HTMX -->
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
        document.addEventListener('htmx:afterSwap', function () {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</th:block>

</body>
</html>
